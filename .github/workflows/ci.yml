name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Worker binding types
        run: pnpm cf:types:check

      - name: Check
        run: pnpm check

      - name: Test deployment guards
        run: node --test .github/scripts/*.test.mjs

      - name: Build Web
        run: pnpm build

      - name: Validate Worker package
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: pnpm exec wrangler deploy --dry-run
