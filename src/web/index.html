<!doctype html>
<html lang="zh-CN" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>私人书签柜</title>
    <meta name="description" content="必须登录的个人书签柜，用标签整理自己的链接。" />
    <meta name="theme-color" content="#1d1d1f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta property="og:title" content="私人书签柜" />
    <meta property="og:description" content="必须登录的个人书签柜，用标签整理自己的链接。" />
    <meta property="og:type" content="website" />
    <link id="site-favicon" rel="icon" type="image/svg+xml" href="/hm-light.svg?v=1" />
    <link rel="apple-touch-icon" href="/icons/icon-128.png" />
    <script>
      (() => {
        try {
          const key = 'lacquer-shift-theme';
          const current = localStorage.getItem(key);
          const legacy = localStorage.getItem('nav-theme');
          const preference =
            current === 'light' || current === 'dark' || current === 'system'
              ? current
              : legacy === 'light' || legacy === 'dark' || legacy === 'system'
                ? legacy
                : 'light';
          const theme =
            preference === 'system' && window.matchMedia?.('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : preference === 'dark'
                ? 'dark'
                : 'light';
          const root = document.documentElement;
          root.classList.remove('dark', 'light');
          root.classList.add(theme);
          root.style.colorScheme = theme;
          document.getElementById('site-favicon').href = '/hm-' + theme + '.svg?v=1';
        } catch {
          /* ignore */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
