<!doctype html>
<html lang="zh-CN" class="light" data-palette="indigo">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>书签柜 · 网站导航</title>
    <meta
      name="description"
      content="浏览公开网站收藏，按分类与标签查找链接，快速搜索站内书签或网页。"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0b0f19" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta property="og:title" content="书签柜 · 网站导航" />
    <meta
      property="og:description"
      content="浏览公开网站收藏，按分类与标签查找链接，快速搜索站内书签或网页。"
    />
    <meta property="og:type" content="website" />
    <link id="site-favicon" rel="icon" type="image/svg+xml" href="/hm-light.svg?v=1" />
    <link rel="apple-touch-icon" href="/icons/icon-128.png" />
    <script>
      (() => {
        try {
          const key = 'lacquer-shift-theme';
          const current = localStorage.getItem(key);
          const legacy = localStorage.getItem('nav-theme');
          const preference =
            current === 'light' || current === 'dark' || current === 'system'
              ? current
              : legacy === 'light' || legacy === 'dark' || legacy === 'system'
                ? legacy
                : 'light';
          const theme =
            preference === 'system' && window.matchMedia?.('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : preference === 'dark'
                ? 'dark'
                : 'light';
          const storedPalette = localStorage.getItem('nav-palette');
          const palette =
            storedPalette === 'indigo' ||
            storedPalette === 'emerald' ||
            storedPalette === 'amber' ||
            storedPalette === 'rose'
              ? storedPalette
              : 'indigo';
          const rawOpacity = localStorage.getItem('nav-bg-overlay-opacity');
          const parsedOpacity =
            rawOpacity !== null && rawOpacity.trim() !== '' ? Number(rawOpacity) : NaN;
          const opacity = Number.isFinite(parsedOpacity)
            ? Math.round(Math.min(0.95, Math.max(0.25, parsedOpacity)) * 100) / 100
            : 0.72;
          const storedSidebar = localStorage.getItem('nav-front-sidebar-open');
          const frontSidebar = storedSidebar === 'false' ? 'collapsed' : 'expanded';
          const root = document.documentElement;
          const colorSchemeMeta = document.querySelector('meta[name="color-scheme"]');
          if (colorSchemeMeta) {
            colorSchemeMeta.setAttribute(
              'content',
              preference === 'system' ? 'light dark' : preference,
            );
          }
          root.classList.remove('dark', 'light');
          root.classList.add(theme);
          root.dataset.palette = palette;
          root.dataset.frontSidebar = frontSidebar;
          root.style.setProperty('--bg-overlay-opacity', String(opacity));
          const favicon = document.getElementById('site-favicon');
          if (favicon) favicon.href = '/hm-' + theme + '.svg?v=1';
        } catch {
          /* ignore */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
