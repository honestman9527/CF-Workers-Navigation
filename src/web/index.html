<!doctype html>
<html lang="zh-CN" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>私人书签柜</title>
    <meta name="description" content="必须登录的个人书签柜 — 用文件夹收纳自己的链接。" />
    <meta name="theme-color" content="#161410" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4efe4" media="(prefers-color-scheme: light)" />
    <meta property="og:title" content="私人书签柜" />
    <meta property="og:description" content="必须登录的个人书签柜 — 用文件夹收纳自己的链接。" />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="apple-touch-icon" href="/icons/icon-128.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"
      rel="stylesheet"
    />
    <script>
      (() => {
        try {
          const key = 'lacquer-shift-theme';
          const current = localStorage.getItem(key);
          const legacy = localStorage.getItem('nav-theme');
          const theme =
            current === 'light' || current === 'dark'
              ? current
              : legacy === 'light' || legacy === 'dark'
                ? legacy
                : 'light';
          const root = document.documentElement;
          root.classList.remove('dark', 'light');
          root.classList.add(theme);
          root.style.colorScheme = theme;
        } catch {
          /* ignore */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
